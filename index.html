  else if(st.k=='land')h=ln(0,`<div class="eb">${tag(st.pi)} · Landing</div>`)+ln(1,`<h2>${p.land[0]}</h2>`)+ln(2,`<p>${p.land[1]}</p>`)+ln(3,`<button class="ghost" data-d="${st.pi}">展开详情</button>`)+ln(4,'<div class="ft">继续滚动，沿星球表面前进</div>');
  else if(st.k=='mark'){const m=p.marks[st.mi];h=ln(0,`<div class="eb">${tag(st.pi)} · Landmark ${st.mi+1}/${p.marks.length}</div>`)+ln(1,`<h2>${m[0]}</h2>`)+ln(2,`<p>${m[1]}</p>`)+ln(3,`<button class="ghost" data-d="${st.pi}">展开详情</button>`)}
  else if(st.k=='horizon'){const [a,...b]=p.hook.split('：');h=ln(0,`<div class="eb">${tag(st.pi)} · Horizon</div>`)+ln(1,`<h2>${a}</h2>`)+ln(2,`<p>${b.join('：')}</p>`)+ln(3,'<button class="ghost" data-go>起飞 →</button>')+ln(4,'<div class="ft">或继续滚动 · 也可以直接点那颗星球</div>')}
  else if(st.k=='home'){const n=seen.filter(Boolean).length;h=ln(0,'<div class="eb">Home · 归航</div>')+ln(1,`<h2>${n==N?N+' 颗星全部点亮':'已点亮 '+n+' / '+N}</h2>`)+ln(2,CONTACT.email?`<p>${CONTACT.email}</p>`:'<p>谢谢你一路看到这里。</p>')+ln(3,CONTACT.email?'<button class="ghost" data-d="0">联系与简历</button>':'')+ln(4,'<div class="ft">继续滚动，飞出星云</div>')}
  card.innerHTML=h;void card.offsetWidth;card.classList.add('show');
}
card.addEventListener('click',e=>{if(e.target.closest('[data-go]')){if(!anim)go(1);return}const b=e.target.closest('[data-d]');if(b)openDrawer(+b.dataset.d)});
const ICON=['radial-gradient(circle at 35% 30%,#fff3a0,#ffd23f 45%,#c9861a)','radial-gradient(circle at 35% 30%,#c8f0a0,#5fb04e 50%,#2f6f8f)','radial-gradient(circle at 35% 30%,#ffb347,#ff5fa0 30%,#13241a 62%)','radial-gradient(circle at 35% 30%,#fff3e0,#f2a99f 50%,#b98ce6)','conic-gradient(#fbf7ef 0 25%,#f59e2b 0 50%,#fbf7ef 0 75%,#2f8f83 0)','radial-gradient(circle at 35% 30%,#fff,#9fe0ff 35%,#c49bff 70%,#4fa3ff)','radial-gradient(circle at 35% 30%,#ffe6cc,#f0bf92 55%,#b9825a)','radial-gradient(circle at 35% 30%,#f4f1e6,#9cc27a 40%,#e8956b 70%,#1d1d1d)'];
P.forEach((p,i)=>{const b=document.createElement('button');b.style.background=ICON[i];b.innerHTML=`<span>${tag(i).slice(0,2)} ${p.name}</span>`;b.setAttribute('aria-label',p.name);b.onclick=()=>flyTo(LAND[i]);dots.appendChild(b)});
const CP=[[5,30],[13,12],[22,24],[30,8],[39,20],[48,6],[58,14],[53,34]];
function updateChrome(){
  const pi=S[cur].pi;[...dots.children].forEach((b,i)=>{b.classList.toggle('on',i===pi);b.classList.toggle('seen',seen[i])});
  let s='';for(let i=0;i<N;i++){const j=(i+1)%N;if(seen[i]&&seen[j])s+=`<line x1="${CP[i][0]}" y1="${CP[i][1]}" x2="${CP[j][0]}" y2="${CP[j][1]}" stroke="#f5efe2" stroke-opacity=".7"/>`}
  CP.forEach((c,i)=>s+=`<circle cx="${c[0]}" cy="${c[1]}" r="${seen[i]?2.6:1.6}" fill="#f5efe2" fill-opacity="${seen[i]?1:.35}"/>`);
  document.getElementById('cons').innerHTML=s;document.getElementById('litT').textContent=seen.filter(Boolean).length+' / '+N+' LIT';
}
const drawer=document.getElementById('drawer'),list=document.getElementById('list');
function openDrawer(i){const p=P[i];
  drawer.innerHTML=`<button class="x" onclick="closeAll()">关闭</button><div class="eb">${tag(i)}</div><h2>${p.land[0]}</h2><p>${p.land[1]}</p>`+p.marks.map(m=>`<h3>${m[0]}</h3><p>${m[1]}</p>`).join('')+(i===0&&CONTACT.email?`<h3>联系我</h3><p class="mail"><a href="mailto:${CONTACT.email}">${CONTACT.email}</a> <button class="ghost" id="copyMail">复制</button></p>`+(CONTACT.resume?`<p><a class="ghost" href="${CONTACT.resume}" target="_blank" rel="noopener">查看简历</a></p>`:''):'');
  const cm=document.getElementById('copyMail');if(cm)cm.onclick=()=>{navigator.clipboard.writeText(CONTACT.email).then(()=>cm.textContent='已复制',()=>{const r=document.createRange();r.selectNodeContents(cm.previousElementSibling);getSelection().removeAllRanges();getSelection().addRange(r)})};
  drawer.scrollTop=0;drawer.classList.add('open')}
function closeAll(){drawer.classList.remove('open');list.hidden=true}
document.getElementById('workBtn').onclick=()=>{
  document.getElementById('listIn').innerHTML='<div><button class="x" onclick="closeAll()">关闭</button><div class="eb">All planets</div><h2 style="font-family:"ZCOOL QingKe HuangYou","Noto Sans SC",sans-serif;font-weight:400;font-size:56px;margin:6px 0 16px">WORK</h2></div>'+P.map((p,i)=>`<button class="it" data-i="${i}"><span class="eb">${tag(i)}</span><b>${p.land[0]}</b><span>${p.land[1]}</span></button>`).join('');
  list.hidden=false;list.scrollTop=0};
document.getElementById('skip').onclick=e=>{e.preventDefault();document.getElementById('workBtn').click()};
document.getElementById('aboutBtn').onclick=()=>{closeAll();flyTo(LAND[0])};
list.addEventListener('click',e=>{const b=e.target.closest('[data-i]');if(b){closeAll();flyTo(LAND[+b.dataset.i]);openDrawer(+b.dataset.i)}});

// ---------- 声音：默认静音，用 WebAudio 合成环境音；悬停“联系我”时变闷 ----------
let AC=null,master,lp,soundOn=false;
function initAudio(){AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=0;lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=4500;lp.connect(master);master.connect(AC.destination);
  [[110,.0],[164.81,.3],[220,.6],[329.63,.9]].forEach(([fq,ph])=>{const o=AC.createOscillator();o.frequency.value=fq;o.detune.value=ph*6;const g=AC.createGain();g.gain.value=.045;const l=AC.createOscillator();l.frequency.value=.05+ph*.08;const lg=AC.createGain();lg.gain.value=.035;l.connect(lg);lg.connect(g.gain);o.connect(g);g.connect(lp);o.start();l.start()});
  const b=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate),d=b.getChannelData(0);let x=0;for(let i=0;i<d.length;i++){x=.98*x+.02*(Math.random()*2-1);d[i]=x*3}
  const ns=AC.createBufferSource();ns.buffer=b;ns.loop=true;const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=700;const ng=AC.createGain();ng.gain.value=.05;ns.connect(bp);bp.connect(ng);ng.connect(lp);ns.start()}
const soundBtn=document.getElementById('sound');
soundBtn.onclick=()=>{if(!AC)initAudio();AC.resume();soundOn=!soundOn;master.gain.setTargetAtTime(soundOn?.6:0,AC.currentTime,.5);soundBtn.setAttribute('aria-pressed',String(soundOn))};
const goBtn=document.getElementById('go');
goBtn.addEventListener('pointerenter',()=>{hover=true;if(AC)lp.frequency.setTargetAtTime(320,AC.currentTime,.35)});
goBtn.addEventListener('pointerleave',()=>{hover=false;if(AC)lp.frequency.setTargetAtTime(4500,AC.currentTime,.35)});
goBtn.onclick=()=>openDrawer(0);if(!CONTACT.email)goBtn.hidden=true;

// ---------- 输入 ----------
const inPanel=t=>(drawer.classList.contains('open')&&drawer.contains(t))||!list.hidden;
let armed=true,lastWheel=0,acc=0;
addEventListener('wheel',e=>{
  if(inPanel(e.target))return;e.preventDefault();
  const now=performance.now(),gap=now-lastWheel;lastWheel=now;
  if(anim){armed=false;return}
  if(!armed){if(gap<180)return;armed=true;acc=0}
  acc+=e.deltaY;if(Math.abs(acc)>=30){armed=false;go(Math.sign(acc));acc=0}
},{passive:false});
let ty=null;
addEventListener('touchstart',e=>{if(inPanel(e.target)||e.target.closest('button'))return;ty=e.touches[0].clientY},{passive:true});
addEventListener('touchmove',e=>{if(ty!=null)e.preventDefault()},{passive:false});
addEventListener('touchend',e=>{if(ty==null)return;const dy=ty-e.changedTouches[0].clientY;ty=null;if(Math.abs(dy)>40&&!anim)go(Math.sign(dy))});
addEventListener('keydown',e=>{
  if(e.key=='Escape'){closeAll();return}
  if(drawer.classList.contains('open')||!list.hidden)return;
  if(['ArrowDown','PageDown',' '].includes(e.key)){e.preventDefault();if(!anim)go(1)}
  if(['ArrowUp','PageUp'].includes(e.key)){e.preventDefault();if(!anim)go(-1)}
});
addEventListener('pointermove',e=>{mx=e.clientX/W*2-1;my=e.clientY/H*2-1});
addEventListener('pointerleave',()=>{mx=my=0});
// 点击：地标或当前星球 → 详情；其他星球 → 飞过去；远景和退出画面不响应点击
const ray=new THREE.Raycaster(),pick=[...planets.map(p=>p.mesh)];
host.addEventListener('click',e=>{
  if(anim)return;const k=S[cur].k;if(k=='far'||k=='exit')return;
  ray.setFromCamera(new THREE.Vector2(e.clientX/W*2-1,-(e.clientY/H*2-1)),camera);
  const hit=ray.intersectObjects([...pick,...toys.map(t=>t.g)],true)[0];if(!hit)return;
  const i=hit.object.userData.pi;if(i==null)return;
  const isToy=toys.some(t=>t.g.getObjectById(hit.object.id));
  (isToy||i===S[cur].pi)?openDrawer(i):flyTo(LAND[i]);
});
host.addEventListener('pointermove',e=>{if(anim)return host.style.cursor='';const k=S[cur].k;if(k=='far'||k=='exit'){host.style.cursor='';return}
  ray.setFromCamera(new THREE.Vector2(e.clientX/W*2-1,-(e.clientY/H*2-1)),camera);host.style.cursor=ray.intersectObjects([...pick,...toys.map(t=>t.g)],true).length?'pointer':''});

function fromHash(animate){const m=location.hash.match(/^#planet-([1-8])$/);if(!m)return false;const to=LAND[m[1]-1];
  if(animate){if(to!==cur)flyTo(to)}else{cur=to;camS={cam:S[to].cam.slice(),tgt:S[to].tgt.slice()};arrive()}return true}
addEventListener('hashchange',()=>fromHash(true));
if(!fromHash(false))arrive();
requestAnimationFrame(tick);
</script>
