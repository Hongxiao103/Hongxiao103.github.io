</style></head><body><canvas id="galaxy" aria-hidden="true"></canvas><header><a class="brand" href="#top">HONGXIAO HE<span style="color:#ff9e6a"> ·</span></a><nav><a href="#about">关于</a><a href="#contact">联系</a></nav></header><main id="top"><div class="hero"><p class="eyebrow">Curiosity · Creativity · Exploration</p><h1>何虹晓</h1><p class="subtitle">一个永远对世界好奇的人</p><span class="hint">SCROLL TO EXPLORE ↓</span></div><div class="line"></div><section class="info" id="about"><h2>01 / 关于我</h2><div><p>悉尼大学交互设计研究生在读。<br>保持好奇，持续探索设计与世界之间的联系。</p><span class="chip">绘画 · Painting</span></div></section><div class="line"></div><section class="info" id="contact"><h2>02 / 联系我</h2><div><p>欢迎交流与分享想法。</p><p><a class="contact" href="mailto:13658894217@163.com">13658894217@163.com ↗</a></p></div></section></main><footer><span>© <span id="year"></span> HONGXIAO HE</span><span>MADE WITH CURIOSITY</span></footer>
<script>
document.getElementById('year').textContent=new Date().getFullYear();
(()=>{const c=document.getElementById('galaxy'),ctx=c.getContext('2d');if(!ctx)return;let w,h,dpr,stars=[],t=0;const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;function resize(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;c.width=w*dpr;c.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);const count=Math.min(1600,Math.max(480,Math.floor(w*h/800)));stars=Array.from({length:count},()=>{let arm=Math.floor(Math.random()*4),radius=Math.pow(Math.random(),.72),angle=radius*7+arm*Math.PI/2+(Math.random()-.5)*.9;return {radius,angle,drift:Math.random()*6.28,size:.35+Math.random()*1.6,hue:Math.random(),alpha:.3+Math.random()*.7}})}function draw(){ctx.clearRect(0,0,w,h);const cx=w*.5,cy=h*.45,scale=Math.min(w*.43,420),spin=t*.000055;let glow=ctx.createRadialGradient(cx,cy,0,cx,cy,scale*.65);glow.addColorStop(0,'rgba(255,130,55,.38)');glow.addColorStop(.12,'rgba(255,101,65,.13)');glow.addColorStop(.5,'rgba(73,56,186,.07)');glow.addColorStop(1,'transparent');ctx.fillStyle=glow;ctx.fillRect(0,0,w,h);for(const p of stars){const a=p.angle+spin,r=p.radius*scale;const x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r*.43+Math.sin(a*2+p.drift)*r*.035;if(x<0||x>w||y<0||y>h)continue;const inner=p.radius<.22;ctx.fillStyle=inner?'rgba(255,166,95,'+p.alpha+')':p.hue<.48?'rgba(124,128,255,'+p.alpha+')':'rgba(178,114,255,'+p.alpha+')';ctx.beginPath();ctx.arc(x,y,p.size*(1-p.radius*.45),0,Math.PI*2);ctx.fill()}if(!reduced){t+=16;requestAnimationFrame(draw)}}addEventListener('resize',resize);resize();draw()})();
